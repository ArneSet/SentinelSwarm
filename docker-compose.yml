# SentinelSwarm local stack: fleet API + Prometheus + Grafana.
# Everything runs in simulation; no real drone hardware is involved.

services:
  api:
    build: .
    image: sentinelswarm:local
    container_name: sentinelswarm-api
    ports:
      - "8000:8000"
    environment:
      SENTINEL_LOG_LEVEL: INFO
      SENTINEL_ENVIRONMENT: simulation
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelswarm-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelswarm-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

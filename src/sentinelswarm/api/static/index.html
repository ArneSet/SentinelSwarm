<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SENTINELSWARM · Command</title>
    <link rel="stylesheet" href="/dashboard/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/dashboard/vendor/three.module.js",
          "three/addons/controls/OrbitControls.js": "/dashboard/vendor/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body data-world="sim">
    <div id="app">
      <header id="topbar">
        <div class="world-switch" id="worldSwitch">
          <button data-w="sim" class="on"><span class="led"></span>SIM</button>
          <button data-w="real"><span class="led"></span>REAL</button>
        </div>
        <div class="brand">
          <div class="n">SENTINEL<b>SWARM</b></div>
          <div class="s">Fleet Command</div>
        </div>
        <div class="sp"></div>
        <span class="classif" id="classif">UNCLASSIFIED // SIMULATION</span>
        <div class="tstat"><span>UNITS</span><b id="tUnits">0</b></div>
        <div class="tstat"><span>STREAM</span><b id="tRate">— Hz</b></div>
        <div class="tstat"><span class="led off" id="tLed"></span><b id="tConn">OFFLINE</b></div>
        <div class="tstat"><span>MET</span><b id="tClock">00:00:00</b></div>
      </header>

      <div id="body">
        <nav id="rail">
          <div class="nav" id="nav">
            <a href="#/overview" data-r="overview">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
              Overview
            </a>
            <a href="#/map" data-r="map">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
              Tactical Map
            </a>
            <a href="#/terrain" data-r="terrain">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 17l6-9 4 5 3-4 5 8z"/><path d="M3 20h18"/></svg>
              3D Terrain
            </a>
            <div class="grouplabel">Fleet</div>
            <a href="#/fleet" data-r="fleet">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3 6 6 .5-4.5 4 1.5 6L12 15l-6 3.5 1.5-6L3 8.5 9 8z"/></svg>
              Units
            </a>
            <a href="#/missions" data-r="missions">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
              Missions
            </a>
            <a href="#/incidents" data-r="incidents">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>
              Incidents
            </a>
          </div>
          <div class="rail-foot">
            <div class="worldcard">
              <div class="wl">Active World</div>
              <div class="wv" id="wcName">SIMULATION</div>
              <div class="wm" id="wcMeta">0 units · 0 active</div>
              <div class="wm" id="wcArea">0 m² mapped</div>
            </div>
          </div>
        </nav>
        <main id="view"></main>
      </div>
    </div>
    <script type="module" src="/dashboard/app.js"></script>
  </body>
</html>
